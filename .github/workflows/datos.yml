name: Copia de datos de ESPN

# Cada 10 minutos guarda una copia de partidos, clasificación, noticias, lesiones,
# fichas de partido y plantillas en la rama "data". La web la usa si no puede
# leer la API de ESPN directamente desde el navegador.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/snapshot.mjs, .github/workflows/datos.yml]

permissions:
  contents: write

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar la copia anterior
        run: |
          if git fetch --depth=1 origin data; then
            git worktree add snap FETCH_HEAD
          else
            mkdir snap
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar datos de ESPN
        run: node scripts/snapshot.mjs snap

      - name: Comprobar si ESPN permite peticiones desde la web (diagnóstico)
        continue-on-error: true
        run: |
          curl -sSI -H "Origin: https://ikerrmansso69.github.io" \
            "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard" \
            | grep -iE "^HTTP|access-control" || echo "Sin cabeceras CORS"

      - name: Publicar en la rama data
        run: |
          cd snap
          rm -rf .git
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Datos $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
